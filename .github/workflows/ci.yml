

name: DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build -t devops-production-app:ci .

      - name: Test application health endpoint
        run: |
          docker run -d --name app-test -p 127.0.0.1:5000:5000 devops-production-app:ci
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:5000/health; then
              docker rm -f app-test
              exit 0
            fi
            sleep 2
          done
          docker logs app-test
          docker rm -f app-test
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-production-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-production-app:${{ github.sha }}
